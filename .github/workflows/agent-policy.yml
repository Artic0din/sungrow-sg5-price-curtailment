name: Agent delivery policy

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted default-branch action; no PR code executes
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Evaluate agent delivery policy
    runs-on: ubuntu-latest
    permissions:
      checks: write # Publish the trusted result against the pull-request head SHA.
      contents: read # Load the policy implementation from the default branch.
      issues: read # Verify issue-backed pull requests.
      pull-requests: read # Read pull-request metadata.
    steps:
      - name: Mark pull-request head validation as in progress
        id: head-check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          check_run_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Validate agent delivery policy" \
            -f head_sha="$HEAD_SHA" \
            -f status=in_progress \
            -f "output[title]=Agent delivery policy" \
            -f "output[summary]=Pull-request metadata validation is running." \
            --jq .id)
          echo "check-run-id=$check_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: policy
        uses: ./.github/actions/pr-policy
        with:
          github-token: ${{ github.token }}
      - name: Publish result against pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ steps.head-check.outputs.check-run-id }}
          RESULT: ${{ steps.policy.outputs.validation-result }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            conclusion=success
            summary="Pull-request metadata satisfies the agent delivery policy."
          else
            conclusion=failure
            summary="Pull-request metadata violates the agent delivery policy. See the evaluation log for details."
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Agent delivery policy" \
            -f "output[summary]=$summary"
      - name: Fail when policy validation fails
        if: steps.policy.outputs.validation-result != 'success'
        run: exit 1
