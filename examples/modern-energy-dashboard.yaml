              ## 🆘 Quick Troubleshooting

              **Inverter not responding:**
              1. Check IP address hasn't changed
              2. Test modbus write in Developer Tools
              3. Verify WiNet-S is powered on

              **Automation not triggering:**
              1. Check all sensors are available
              2. Verify thresholds are set correctly
              3. Check automation traces

              **Sensors unavailable:**
              1. Check integration status
              2. Restart integration if needed
              3. Verify network connectivity

              **Need help?**
              Open an issue on GitHub with:
              - Home Assistant version
              - Error logs
              - Steps to reproduce

